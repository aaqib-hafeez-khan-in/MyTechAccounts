<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="aaqibhafeez — coding, learning, data and freelance profiles in one place." />
  <title>aaqibhafeez — profiles</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23222%22/><text x=%2250%%22 y=%2250%%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 fill=%22%234ade80%22 font-family=%22monospace%22 font-weight=%22bold%22 font-size=%2260%22>&gt;_</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f7f5;
      --surface: #ffffff;
      --surface-soft: #f0f2ef;
      --border: #dde1dc;
      --border-strong: #c7cdc6;
      --text: #171a18;
      --muted: #6d756e;
      --accent: #198754;
      --accent-soft: #e7f5ed;
      --warm: #b7791f;
      --warm-soft: #fff5df;
      --shadow: 0 18px 50px rgba(20, 30, 24, .07);
    }
    [data-theme="dark"] {
      --bg: #0c100e;
      --surface: #121814;
      --surface-soft: #18201a;
      --border: #28332b;
      --border-strong: #38453b;
      --text: #edf2ee;
      --muted: #8e9b91;
      --accent: #55c98a;
      --accent-soft: #153323;
      --warm: #e2b35b;
      --warm-soft: #302817;
      --shadow: 0 18px 55px rgba(0, 0, 0, .28);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, var(--accent-soft), transparent 30rem), var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      transition: background .2s ease, color .2s ease;
    }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    .page { width: min(1040px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 64px; }
    .hero {
      position: relative;
      overflow: hidden;
      padding: 36px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      box-shadow: var(--shadow);
    }
    .hero::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      right: -90px;
      top: -100px;
      border-radius: 50%;
      background: var(--accent-soft);
      pointer-events: none;
    }
    .hero-top { position: relative; z-index: 1; display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; }
    .eyebrow { margin: 0 0 10px; color: var(--accent); font: 600 12px/1 JetBrains Mono, monospace; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(28px, 5vw, 44px); line-height: 1.08; letter-spacing: -.04em; }
    h1 span { color: var(--muted); font-weight: 400; }
    .intro { max-width: 680px; margin: 14px 0 0; color: var(--muted); font-size: 15px; line-height: 1.7; }
    .theme-btn {
      position: relative; z-index: 2; flex: 0 0 auto; border: 1px solid var(--border-strong); border-radius: 999px;
      background: var(--surface); color: var(--text); padding: 9px 14px; cursor: pointer; font: 600 12px JetBrains Mono, monospace;
    }
    .theme-btn:hover { border-color: var(--accent); color: var(--accent); }
    .stats { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 9px; margin-top: 26px; }
    .stat { padding: 8px 11px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-soft); color: var(--muted); font: 12px JetBrains Mono, monospace; }
    .stat b { color: var(--text); font-weight: 600; }
    .toolbar { margin: 28px 0 18px; display: grid; gap: 12px; }
    .search-wrap { position: relative; }
    .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); font: 14px JetBrains Mono, monospace; pointer-events: none; }
    #search {
      width: 100%; border: 1px solid var(--border); border-radius: 12px; outline: none; background: var(--surface); color: var(--text);
      padding: 14px 16px 14px 42px; font-size: 14px; box-shadow: 0 4px 16px rgba(20, 30, 24, .03); transition: border .15s, box-shadow .15s;
    }
    #search::placeholder { color: var(--muted); }
    #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .filters { display: flex; flex-wrap: wrap; gap: 7px; }
    .filter-btn {
      border: 1px solid var(--border); border-radius: 999px; background: var(--surface); color: var(--muted); padding: 7px 12px;
      cursor: pointer; font: 600 11px JetBrains Mono, monospace; text-transform: capitalize; transition: all .15s ease;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); }
    .filter-btn.active { border-color: var(--accent); background: var(--accent); color: #fff; }
    .list-shell { overflow: hidden; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
    .list-header { display: grid; grid-template-columns: 1fr 110px 86px; padding: 12px 18px; border-bottom: 1px solid var(--border); background: var(--surface-soft); color: var(--muted); font: 600 10px JetBrains Mono, monospace; letter-spacing: .1em; text-transform: uppercase; }
    .platform-row { display: grid; grid-template-columns: 1fr 110px 86px; align-items: center; gap: 12px; padding: 13px 18px; border-bottom: 1px solid var(--border); transition: background .15s ease, transform .15s ease; }
    .platform-row:last-child { border-bottom: 0; }
    .platform-row:hover { background: var(--surface-soft); }
    .platform-row.pinned-row { box-shadow: inset 3px 0 0 var(--warm); }
    .row-main { min-width: 0; display: flex; align-items: center; gap: 13px; }
    .platform-icon { width: 38px; height: 38px; flex: 0 0 38px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-soft); color: var(--accent); font: 700 12px JetBrains Mono, monospace; }
    .row-text { min-width: 0; }
    .row-name { display: flex; align-items: center; gap: 7px; min-width: 0; font-size: 14px; font-weight: 600; }
    .row-name a { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: inherit; text-decoration: none; }
    .row-name a:hover { color: var(--accent); }
    .pin-badge { color: var(--warm); font: 11px JetBrains Mono, monospace; }
    .row-desc { margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12px; }
    .row-cat { color: var(--muted); font: 11px JetBrains Mono, monospace; text-transform: capitalize; }
    .actions { display: flex; justify-content: flex-end; gap: 3px; }
    .act-btn {
      position: relative; width: 34px; height: 34px; display: grid; place-items: center; border: 0; border-radius: 9px;
      background: transparent; color: var(--muted); cursor: pointer; text-decoration: none; font-size: 14px; transition: all .15s ease;
    }
    .act-btn:hover { background: var(--surface-soft); color: var(--text); }
    .act-btn.pin-active { color: var(--warm); }
    .act-btn.copied { color: var(--accent); }
    .act-btn::after { content: attr(data-tip); position: absolute; right: 0; bottom: calc(100% + 7px); padding: 5px 8px; border: 1px solid var(--border); border-radius: 7px; background: var(--surface); color: var(--text); font: 10px JetBrains Mono, monospace; white-space: nowrap; opacity: 0; pointer-events: none; transform: translateY(3px); transition: opacity .12s, transform .12s; }
    .act-btn:hover::after { opacity: 1; transform: translateY(0); }
    .empty { padding: 42px 18px; text-align: center; color: var(--muted); font-size: 13px; }
    footer { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 22px; color: var(--muted); font: 11px JetBrains Mono, monospace; }
    footer span:last-child { color: var(--accent); }
    :focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
    @media (max-width: 680px) {
      .page { width: min(100% - 20px, 1040px); padding-top: 20px; }
      .hero { padding: 25px 20px; border-radius: 16px; }
      .hero-top { flex-direction: column; }
      .theme-btn { position: absolute; right: 0; top: 0; }
      .list-header { display: none; }
      .platform-row { grid-template-columns: 1fr auto; padding: 13px 14px; }
      .row-cat { display: none; }
      .platform-icon { width: 34px; height: 34px; flex-basis: 34px; }
      .row-name { font-size: 13px; }
      .row-desc { font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="hero-top">
        <div>
          <p class="eyebrow">aaqibhafeez / profiles</p>
          <h1>My tech accounts <span>in one place.</span></h1>
          <p class="intro">All my coding, learning, data &amp; freelance accounts — collected into one simple, searchable portfolio.</p>
        </div>
        <button class="theme-btn" id="themeBtn" type="button" aria-label="Switch color theme">☾ dark</button>
      </div>
      <div class="stats" aria-label="Profile statistics">
        <span class="stat">accounts <b id="statTotal">24</b></span>
        <span class="stat">showing <b id="statVisible">24</b></span>
        <span class="stat">pinned <b id="statPinned">0</b></span>
        <span class="stat">categories <b id="statCategories">5</b></span>
      </div>
    </section>

    <section class="toolbar" aria-label="Account filters">
      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Search platforms, categories, or keywords…" autocomplete="off" spellcheck="false" aria-label="Search accounts" />
      </div>
      <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
    </section>

    <section class="list-shell" aria-label="Technology accounts">
      <div class="list-header"><div>platform</div><div>category</div><div>actions</div></div>
      <div id="list"></div>
    </section>

    <footer>
      <span>aaqibhafeez khan</span>
      <span id="clock" aria-live="polite"></span>
    </footer>
  </main>

  <script>
    const platforms = [
      { name:"GitHub", slug:"github", url:"https://github.com/aaqib-hafeez-khan-in", cat:"coding", desc:"repos and contributions" },
      { name:"GitLab", slug:"gitlab", url:"https://gitlab.com/aaqibhafeezkhan", cat:"coding", desc:"repositories and projects" },
      { name:"Bitbucket", slug:"bitbucket", url:"https://bitbucket.org/aaqibhafeezkhan/workspace/repositories/", cat:"coding", desc:"repositories and projects" },
      { name:"LeetCode", slug:"leetcode", url:"https://leetcode.com/u/Aaqibhafeezkhan/", cat:"coding", desc:"dsa practice and contests" },
      { name:"FreeCodeCamp", slug:"freecodecamp", url:"https://www.freecodecamp.org/AaqibhafeezKhan", cat:"learning", desc:"web dev certifications" },
      { name:"HackerRank", slug:"hackerrank", url:"https://www.hackerrank.com/profile/AaqibhafeezKhan", cat:"coding", desc:"skill badges and certs" },
      { name:"Sololearn", slug:"sololearn", url:"https://www.sololearn.com/en/profile/32709822", cat:"learning", desc:"interactive courses" },
      { name:"Forage", slug:"theforage", url:"https://www.theforage.com/profile/rHHm2ASBs4XerTfmS", cat:"learning", desc:"virtual work experience" },
      { name:"Kaggle", slug:"kaggle", url:"https://www.kaggle.com/aaqibhafeezkhan", cat:"data", desc:"notebooks and competitions" },
      { name:"Code Signal", slug:"codesignal", url:"https://learn.codesignal.com/profile/cm2k71ob60027if0hoh81z0jk", cat:"coding", desc:"assessments and benchmarks" },
      { name:"Maven Analytics", slug:"mavenanalytics", url:"https://mavenanalytics.io/profile/Aaqibhafeez-Khan/208786550", cat:"data", desc:"analytics portfolio" },
      { name:"Hacker Earth", slug:"hackerearth", url:"https://www.hackerearth.com/@aaqibhafeezkhan/", cat:"coding", desc:"hackathons and sprints" },
      { name:"Data Camp", slug:"datacamp", url:"https://www.datacamp.com/portfolio/aaqibhafeezkhan", cat:"data", desc:"data science tracks" },
      { name:"CodeChef", slug:"codechef", url:"https://www.codechef.com/users/aaqibhhkhan", cat:"coding", desc:"competitive contests" },
      { name:"CodeForces", slug:"codeforces", url:"https://www.codeforces.com/profile/AaqibhafeezKhan", cat:"coding", desc:"algorithm rating" },
      { name:"Naukri 360", slug:"naukri", url:"https://www.naukri.com/code360/profile/3ed37a85-deec-49c7-86cb-6b568873a187", cat:"coding", desc:"code360 problems" },
      { name:"GeeksforGeeks", slug:"geeksforgeeks", url:"https://www.geeksforgeeks.org/user/aaqibhafeezkhan/", cat:"learning", desc:"cs fundamentals streak" },
      { name:"Upwork", slug:"upwork", url:"https://www.upwork.com/freelancers/~01cf658afd0a6ec8ae", cat:"freelance", desc:"freelance projects" },
      { name:"mulearn", slug:"mulearn", url:"https://app.mulearn.org/profile/aaqibhafeezkhan@mulearn", cat:"learning", desc:"community karma" },
      { name:"Interviewbit", slug:"interviewbit", url:"https://www.interviewbit.com/profile/aaqibhafeez-khan", cat:"coding", desc:"interview prep" },
      { name:"Google Devs", slug:"googledevelopers", url:"https://g.dev/aaqibhafeez-khan", cat:"learning", desc:"badges and codelabs" },
      { name:"Microsoft Learn", slug:"microsoft", url:"https://learn.microsoft.com/en-us/aaqibhafeezkhan-6989", cat:"learning", desc:"certs and learning paths" },
      { name:"FutureLearn", slug:"futurelearn", url:"https://www.futurelearn.com/profiles/22066310", cat:"learning", desc:"university-backed courses" },
      { name:"Top Coder", slug:"topcoder", url:"https://profiles.topcoder.com/aaqibhafeezkhan", cat:"coding", desc:"algorithm challenges" }
    ];

    const categories = ["all", ...new Set(platforms.map(p => p.cat))];
    let activeFilter = "all";
    let query = "";
    let pinned = JSON.parse(localStorage.getItem("ahk_pinned") || "[]");
    let isDark = localStorage.getItem("ahk_theme") === "dark";

    const themeBtn = document.getElementById("themeBtn");
    const search = document.getElementById("search");
    const filtersEl = document.getElementById("filters");
    const listEl = document.getElementById("list");

    function applyTheme() {
      document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
      themeBtn.textContent = isDark ? "☀ light" : "☾ dark";
    }

    themeBtn.addEventListener("click", () => {
      isDark = !isDark;
      localStorage.setItem("ahk_theme", isDark ? "dark" : "light");
      applyTheme();
    });

    function initials(name) {
      return name.replace(/[^A-Za-z0-9 ]/g, "").split(" ").map(part => part[0]).join("").slice(0, 2).toUpperCase();
    }

    function copyURL(url, btn) {
      navigator.clipboard.writeText(url).then(() => {
        btn.classList.add("copied");
        btn.setAttribute("data-tip", "copied");
        setTimeout(() => {
          btn.classList.remove("copied");
          btn.setAttribute("data-tip", "copy url");
        }, 1500);
      }).catch(() => {});
    }

    function togglePin(slug) {
      pinned = pinned.includes(slug) ? pinned.filter(item => item !== slug) : [...pinned, slug];
      localStorage.setItem("ahk_pinned", JSON.stringify(pinned));
      render();
    }

    function matches(platform) {
      const haystack = `${platform.name} ${platform.cat} ${platform.desc}`.toLowerCase();
      return (activeFilter === "all" || platform.cat === activeFilter) && (!query || haystack.includes(query));
    }

    function renderFilters() {
      filtersEl.innerHTML = "";
      categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `filter-btn${cat === activeFilter ? " active" : ""}`;
        btn.textContent = cat;
        btn.setAttribute("aria-pressed", String(cat === activeFilter));
        btn.addEventListener("click", () => {
          activeFilter = cat;
          renderFilters();
          render();
        });
        filtersEl.appendChild(btn);
      });
    }

    function render() {
      const visible = platforms.filter(matches).sort((a, b) => Number(pinned.includes(b.slug)) - Number(pinned.includes(a.slug)));
      document.getElementById("statTotal").textContent = platforms.length;
      document.getElementById("statVisible").textContent = visible.length;
      document.getElementById("statPinned").textContent = pinned.length;
      document.getElementById("statCategories").textContent = categories.length - 1;

      if (!visible.length) {
        listEl.innerHTML = `<div class="empty">No profiles match your search. Try another keyword or category.</div>`;
        return;
      }

      listEl.innerHTML = visible.map((platform, index) => {
        const isPinned = pinned.includes(platform.slug);
        return `<article class="platform-row${isPinned ? " pinned-row" : ""}">
          <div class="row-main">
            <div class="platform-icon" aria-hidden="true">${initials(platform.name)}</div>
            <div class="row-text">
              <div class="row-name">
                <a href="${platform.url}" target="_blank" rel="noopener noreferrer">${platform.name}</a>
                ${isPinned ? `<span class="pin-badge" aria-label="Pinned">★</span>` : ""}
              </div>
              <div class="row-desc">${platform.desc}</div>
            </div>
          </div>
          <div class="row-cat">${platform.cat}</div>
          <div class="actions">
            <button class="act-btn${isPinned ? " pin-active" : ""}" type="button" data-tip="${isPinned ? "unpin" : "pin"}" aria-label="${isPinned ? "Unpin" : "Pin"} ${platform.name}" data-action="pin" data-slug="${platform.slug}">${isPinned ? "★" : "☆"}</button>
            <button class="act-btn" type="button" data-tip="copy url" aria-label="Copy ${platform.name} URL" data-action="copy" data-url="${platform.url}">↗</button>
          </div>
        </article>`;
      }).join("");

      listEl.querySelectorAll("[data-action='pin']").forEach(btn => btn.addEventListener("click", () => togglePin(btn.dataset.slug)));
      listEl.querySelectorAll("[data-action='copy']").forEach(btn => btn.addEventListener("click", () => copyURL(btn.dataset.url, btn)));
    }

    search.addEventListener("input", event => {
      query = event.target.value.trim().toLowerCase();
      render();
    });

    function tick() {
      const now = new Date();
      document.getElementById("clock").textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false });
    }

    applyTheme();
    renderFilters();
    render();
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
